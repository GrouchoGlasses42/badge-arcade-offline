name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARM assembler and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          make install
      - run: make test
      - run: make lint
      - run: make verify-release
